<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 384">
	<!--
		Иконка вкладки. Цвет заливки переключается вместе с темой
		браузера: на светлой панели знак тёмный, на тёмной светлый.
		Внутри SVG для этого можно держать обычный media-запрос.
	-->
	<style>
		path { fill: #1d3045 }
		@media (prefers-color-scheme: dark) { path { fill: #eef2f7 } }
	</style>
